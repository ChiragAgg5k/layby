# A blueprint is an ordinary mise.toml. The [tools] and [env] tables are
# standard mise and work with a plain `mise install` on your laptop; the
# [sandbox] table is sbx's namespaced extension, which mise ignores.

[tools]
node = "22"
jq = "1.7.1"

[env]
NODE_ENV = "development"
SBX_EXAMPLE = "node"

[sandbox]
provider = "local"
size = "standard"
ttl = "1h"
idle_timeout = "20m"

[sandbox.hooks]
setup = [
  "node --version",
  "mkdir -p /workspace && echo '{\"ok\":true}' > /workspace/probe.json",
]
verify = ["jq -e .ok /workspace/probe.json"]
